# isa9000 configuration
#
# isa9000 looks for this file in this order:
#   1. the path given with --config (or the ISA9000_CONFIG environment variable)
#   2. ./isa9000.toml in the folder you run it from
#   3. ~/.config/isa9000/config.toml
# Relative paths in this file are resolved from the file's own folder.
# Keep this file private: it can hold credentials.

# "azure" (Microsoft Foundry) or "google" (the Gemini API or Vertex AI).
provider = "azure"

[azure]
# The endpoint of your Microsoft Foundry resource (not of a project), for example
# "https://my-resource.openai.azure.com/" (or leave empty and set the
# AZURE_OPENAI_ENDPOINT environment variable).
endpoint = ""
# An API key of the resource (or the AZURE_OPENAI_API_KEY environment variable).
# Leave both empty to sign in with `az login`, as a user with the Foundry User
# role on the resource.
api_key = ""

[google]
# Option 1: a Gemini API key from https://aistudio.google.com/apikey
# (or leave empty and set the GEMINI_API_KEY environment variable).
api_key = ""

# Option 2: Vertex AI on your own Google Cloud project. When project is set,
# api_key is ignored. Credentials come from credentials_file (a service-account
# JSON key) or, if that is empty, from `gcloud auth application-default login`.
project = ""
location = "global"
credentials_file = ""

[models]
# Empty uses the default of your provider:
#   azure:  text "gpt-6.1-sol", speech "DragonHDLatestNeural",
#           image "gpt-image-2.5-sunburst", transcribe "gpt-transcribe"
#   google: text "gemini-3.1-pro-preview", speech "gemini-2.5-pro-preview-tts",
#           image "gemini-3-pro-image", transcribe with the text model
# On Azure, text, image and transcribe are deployment names in your Foundry
# resource: swap in newer models here as you deploy them.
text = ""
speech = ""
# Draws the cover art of every podcast.
image = ""
# Checks each recording.
transcribe = ""

[narrator]
name = "Isabela"
# Empty uses "en-US-Serena" on Azure and "Kore" on Google. Others to try:
# en-US-Ava or en-US-Emma on Azure; Sulafat, Aoede, Leda or Zephyr on Google.
voice = ""
# Used by Gemini; Azure Speech voices take the tone from the script.
style = "Read the script below like a professional podcaster, with a warm, engaging, and slightly energetic tone."

# How to say names the voice gets wrong, such as product, team or people names.
[narrator.pronunciations]
# "Kubernetes" = "koo-ber-NET-eez"

[branding]
brand = "isa9000"
# Shown in the browser app and recorded in each podcast's podcast.json.
# Leave empty to remove it.
powered_by = "Powered by girlea.ro"

# Spoken at the start and end of every episode. Placeholders:
#   {narrator} {brand} {podcast} {episode} {episodes} {title} {powered_by}
greeting = "Hi, I'm {narrator}. This is {podcast}, episode {episode} of {episodes}: {title}."
ending = "That's it for this episode. Thanks for listening."
final_ending = "That's the end of {podcast}. Thanks for listening."

# Brand colour of the audio generation UI and the presentation website, and a logo (svg, png or jpg).
# Leave logo empty for the isa9000 logo.
accent_color = "#6C3CE1"
logo = ""

[output]
# Each podcast is saved as <folder>/<YYYY-MM-DD> - <Podcast title>/ with one mp3
# and one transcript per episode, plus podcast.json.
folder = "isa9000-audio_kb"
# Check every claim in every episode against its sources, and fix what is wrong
# (up to two rounds). Episodes are also scored as a listener would hear them, and
# those below 9/10 are rewritten (up to three rounds). A podcast that still falls
# short of the quality gate is not recorded until someone reviews it.
fact_check = true

[presentation_website]
# `isa9000 presentation-website` builds the presentation website from the audio knowledge base folder.
# Upload this folder to any static host or bucket inside your network.
folder = "isa9000-presentation_website"
# The address the presentation website will be served from, for example
# "https://podcasts.intranet.example.com/". Needed for the podcast feeds;
# leave empty to build it without feeds.
base_url = ""
title = ""
# The heading of the home page.
heading = "Internal Audio Knowledge Base"
description = "AI-generated podcasts that keep the team up to date."
