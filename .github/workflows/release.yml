name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install build
      - run: python -m build

      - name: Check that the tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: test -f "dist/isa9000-${TAG#v}-py3-none-any.whl"

      - name: Generate subject hashes
        id: hash
        working-directory: dist
        run: echo "hashes=$(sha256sum * | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Generate the SBOM
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python -m venv /tmp/sbomenv
          /tmp/sbomenv/bin/pip install -q dist/*.whl
          pipx run --spec cyclonedx-bom cyclonedx-py environment \
            /tmp/sbomenv --of JSON --output-reproducible \
            -o "isa9000-${TAG#v}.cdx.json"

      - name: Attach the SBOM to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" "isa9000-${TAG#v}.cdx.json"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  provenance:
    needs: [build]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
      upload-assets: true
      upload-tag-name: ${{ github.event.release.tag_name }}

  publish:
    needs: [build, provenance]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
